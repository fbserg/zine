name = "unprompted"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "site"
html_handling = "auto-trailing-slash"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "VOTES"
# For deployment, set id to your own KV namespace ID in wrangler.local.toml.
